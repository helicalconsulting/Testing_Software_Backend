version: '3.8'

services:
  # Java Spring Boot Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa-issue-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=jdbc:postgresql://postgres:5432/qa_logger_db
      - DB_USERNAME=qalogger
      - DB_PASSWORD=qalogger_secure_password
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-demo}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-1234567890}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-secret}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: qa-postgres-db
    restart: always
    environment:
      POSTGRES_DB: qa_logger_db
      POSTGRES_USER: qalogger
      POSTGRES_PASSWORD: qalogger_secure_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qalogger -d qa_logger_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  uploads_data:
