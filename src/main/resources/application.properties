# ===================================================================
# QA Issue Logger - Java Spring Boot Configuration (PostgreSQL)
# ===================================================================

server.port=${PORT:8080}

# ===================================================================
# PostgreSQL Database Configuration
# Set environment variables for production, or edit below for local dev
# ===================================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/qa_logger_db}
spring.datasource.username=${DB_USERNAME:qalogger}
spring.datasource.password=${DB_PASSWORD:qalogger123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP - Spring Boot default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===================================================================
# Cloudinary Configuration
# ===================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}
cloudinary.url=${CLOUDINARY_URL:}

# ===================================================================
# File Upload Limits
# ===================================================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB
